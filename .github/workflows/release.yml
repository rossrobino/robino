name: Release

on:
  push:
    branches:
      - main

permissions: {}
jobs:
  release:
    if: github.repository == 'rossrobino/robino'
    permissions:
      id-token: write
      contents: write
      pull-requests: write
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Setup npm
        run: |
          npm install --global "$(node --input-type=module --eval 'import manifest from "./package.json" with { type: "json" }; console.log(manifest.packageManager)')"

      - name: Install Dependencies
        run: npm ci

      - name: Create Release Pull Request and Publish to npm
        id: changesets
        uses: changesets/action@v2
        with:
          publish-script: npm run release
        env:
          NPM_CONFIG_PROVENANCE: true
